# code_theme 可选值: catppuccin-frappe, catppuccin-latte, catppuccin-macchiato, catppuccin-mocha,
#                    kimbie-dark, kimbie-light, panda-syntax-dark, panda-syntax-light,
#                    paraiso-dark, paraiso-light, rose-pine, rose-pine-dawn,
#                    tokyo-night-dark, tokyo-night-light
code_theme = kimbie-light