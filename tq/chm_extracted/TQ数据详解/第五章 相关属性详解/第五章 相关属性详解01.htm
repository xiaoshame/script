<font style="font-size: 16pt"><br>
</font>
<font size="3" face="华文中宋"><!--HTMLBUILERPART0-->　　躲避率有两种：近战躲避率和投射躲避率。这两种属性的当前值被用在躲避检定中。<BR><BR> 
　　1、　　近战躲避率：<BR><BR> 
　　属性形式：<BR><BR> 
　　界面中文：XX% 机率避开攻击<BR><BR> 
　　界面英文：XX% Chance to Dodge Attacks<BR><BR> 
　　2、　　投射躲避率：<BR><BR> 
　　属性形式：<BR><BR> 
　　界面中文：XX% 机率躲避投射物<BR><BR> 
　　界面英文：XX% Chance to Avoid Projectiles<BR><BR> 
　　这两种属性均无相应加成，并且也没有任何其它因素能对其产生影响，因此“当前属性值”就等于所有来源的属性值总和。 <!--/HTMLBUILERPART0--></font><font style="font-size: 16pt"><br>
<br>
<br>
</font>
<br>
