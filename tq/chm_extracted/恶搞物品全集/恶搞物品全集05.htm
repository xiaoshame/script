<font size="3" face="华文中宋"><!--HTMLBUILERPART0-->　　6.索瑞斯的日记（The Diary of Sorius）<BR><BR> 
　　亲爱的戴尔瑞，<BR><BR> 
　　今天菲得鲁司打赌说我不能杀死一<BR><BR> 
　　个在村子周围到处跑的蛙人。他开<BR><BR> 
　　玩笑的吧？他们体型只是我的一半<BR><BR> 
　　而且很少穿盔甲！这钱太容易赚了<BR><BR> 
　　我是说真的。这能出什么差错？<BR><BR> 
　　导师评语：这也许表示制作小组是知道“青蛙胫甲”（Batrachos Greaves）的超高防御能力加成的。我现在开始怀疑，这件装备是否真的是bug？也许只是制作小组故意跟我们开的一个玩笑？<!--/HTMLBUILERPART0--></font></DIV></td>
